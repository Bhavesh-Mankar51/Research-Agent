[project]
name = "research-agent"
version = "0.1.0"
description = "Agent that researches an app's integration surface: auth, access tier, API surface, MCP, buildability."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.7",
    "langchain-core>=0.3.29",
    "langchain-anthropic>=0.3.0",
    "composio>=0.8.0",
    "composio-langchain>=0.8.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.7",
]

[project.scripts]
research-agent = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a machine-level ruff config can't change what CI enforces.
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    # Several boundaries here catch broadly on purpose: a toolkit that isn't
    # connected, a tool call that 503s, or a cached row that fails validation
    # must degrade the run, not abort it. Each site logs and carries a comment.
    "B904",
]
